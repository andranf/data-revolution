<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="components/shared.jsx"></script>

<script type="text/babel" src="components/SWPDocument.jsx"></script>

<script type="text/babel" src="components/OnboardingFlow.jsx"></script>
<script type="text/babel" src="components/App.jsx"></script>

<script type="text/babel">
  // Mount after babel has transpiled all script tags
  const mount = () => {
    if (!window.App) { requestAnimationFrame(mount); return; }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  };
  mount();
</script>
